<header class="header card">
  <div class="d-flex justify-content-between pb-2">
    <div class="d-flex align-items-center">
      <button class="web-btn" (click)="toggleMenu()"><i class="icon-alig-right"></i></button>

     
    </div>
    <div class="header-right">
      <button class="full-screen" (click)="toggleFullScreen()"><i class="icon-maximize"></i></button>
      <button (click)="toggleTheme()"><i class="icon-dark-mode"></i></button>
  
      <!-- Notification Dropdown (Includes Badge) -->
      <app-dropdown 
        [icon]="'icon-notification'"
     
        [buttonClasses]="['notification-btn']"
        [badgeCount]="3">
       
          <li>
            <a   class="dropdown-item"  href="#notifications"  > 
              <div class="profile-tile"><div class="avatar avatar-sm domain-icon"><i class="icon-notification"></i></div>
              <h5>Inferno Bosco
                 <p>Your password will expire in 3 days.</p></h5></div>
               </a>
          </li>
          <li>
            <a   class="dropdown-item"  href="#notifications"  > 
              <div class="profile-tile"><div class="avatar avatar-sm domain-icon"><i class="icon-notification"></i></div>
              <h5>Inferno Bosco
                 <p>Your password will expire in 3 days.</p></h5></div>
               </a>
          </li>
          <li>
            <a   class="dropdown-item"  href="#notifications"  > 
              <div class="profile-tile"><div class="avatar avatar-sm domain-icon "><i class="icon-admin"></i></div>
              <h5>Inferno Bosco
                 <p>Your password will expire in 3 days.</p></h5></div>
               </a>
          </li>
          <li>
            <a   class="dropdown-item"  href="#notifications"  > 
              <div class="profile-tile"><div class="avatar avatar-sm domain-icon"><i class="icon-notification"></i></div>
              <h5>Inferno Bosco
                 <p>Your password will expire in 3 days.</p></h5></div>
               </a>
          </li>
       
      </app-dropdown>

      <!-- User Profile Dropdown (Includes Name, Role & Image) -->
      <app-dropdown 
  [profileImage]="'assets/dp1.jpg'"
  [userName]="'John Doe'"
  [userRole]="'Admin'"

  [buttonClasses]="['profile-tile', 'fill']"
  (menuItemClick)="onDropdownItemClick($event)">
  <li>
    <a   class="dropdown-item"  href="#profile" >
      Profile
    </a>
  </li>
  <li>
    <a  class="dropdown-item"  href="/change-password" >
      Reset Password
    </a>
  </li>
</app-dropdown>
</div>
  </div>

</header>
