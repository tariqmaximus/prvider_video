
  <div class="row g-3"> <!-- Added g-3 for consistent spacing -->

    <!-- Profile Section -->
    <div class="col-md-3 col-sm-12">
      <div >
        <!-- Profile Card -->
        <app-profile-card 
          class="profile-card w-100" 
          [name]="'Inferno Bosco'" 
          [pid]="'#4274'" 
          [phone]="'123456987'"
          [age]="'84y 9m 5d'" 
          [gender]="'Male'" 
          [dob]="'Mar 29, 1940'" 
          [address]="'1234 Test Avenue, Lowell MA, 01854'">
        </app-profile-card>
      </div>
        <!-- Date Picker Card -->
        <div class="mt-3">
          <app-card 
          class="profile-card"
            [collapsible]="true" 
            [showHeader]="false" 
            [showFooter]="false" 
            [title]="'Select Date'">
            <app-date-picker></app-date-picker>
          </app-card>
        </div>

    </div>


    <!-- Main Content -->
    <div class="col-md-9 col-sm-12">
      <div class="row g-3">

        <!-- Vitals Section -->
        <div class="col-lg-7 col-md-12">
          <app-vitals></app-vitals>

        </div>

        <!-- Allergies Section -->
        <div class="col-lg-5 col-md-12">
          <app-allergies></app-allergies>
        </div>

        <!-- Problems Section -->
        <div class="col-md-6">
          <app-problems></app-problems>
        </div>

        <!-- Medication Section -->
        <div class="col-md-6">
          <app-medication></app-medication>
        </div>
        <div class="col-md-12">
          <app-appointments></app-appointments>
        </div>
      </div>
    </div>

  </div>
