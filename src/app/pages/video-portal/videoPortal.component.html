<div class="row h-100">
  <!-- Waiting Room List -->
  <div class="col-md-3 waiting-list card ">
    <app-waiting-room></app-waiting-room>
  </div>

  <!-- Chat View -->
  <div class="col-md-9">
    <div class="card h-100">
      <ng-container *ngIf="selectedRoom; else noRoom">
        <!-- Room details/chat goes here when a room is selected -->
       
      </ng-container>

      <ng-template #noRoom>
        <div class="d-flex align-items-center justify-content-center h-100 text-muted">
          <app-doctorRoom></app-doctorRoom>
        </div>
      </ng-template>
    </div>
  </div>
</div>
