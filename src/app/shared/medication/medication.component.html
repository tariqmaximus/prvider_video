<app-card 
  title="Medication" 
  icon="icon-medical"
  [headerButtons]="headerButtons"
>
  <div *ngIf="activeTab === 'Ongoing'">
    <ul class="list-lg p-0">
      <li class="checkbox-wrapper d-flex justify-content-between" *ngFor="let med of OngoingMedications; let i = index">
        <input class="inp-cbx" disabled [id]="'med-cbx-Ongoing-' + i" type="checkbox"  style="display: none;"/>
        <label class="cbx" [for]="'med-cbx-Ongoing-' + i">
          <p>
            <svg width="12px" height="9px" viewBox="0 0 12 9">
              <polyline points="1 5 4 8 11 1"></polyline>
            </svg>
          </p>
          <p>
            <span>{{ med.name }}</span><br />
            <span class="">{{ med.condition }}</span>
          </p>
        </label>
      </li>
    </ul>
  </div>

  <div *ngIf="activeTab === 'Paused'">
    <ul class="list-lg p-0">
      <li class="checkbox-wrapper d-flex justify-content-between" *ngFor="let med of PausedMedications; let i = index">
        <input class="inp-cbx" disabled [id]="'med-cbx-Paused-' + i" type="checkbox" checked style="display: none;"/>
        <label class="cbx" [for]="'med-cbx-Paused-' + i">
          <p>
            <svg width="12px" height="9px" viewBox="0 0 12 9">
              <polyline points="1 5 4 8 11 1"></polyline>
            </svg>
          </p>
          <p>
            <span>{{ med.name }}</span><br />
            <span class="">{{ med.condition }}</span>
          </p>
        </label>
      </li>
    </ul>
  </div>
</app-card>
