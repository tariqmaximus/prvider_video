<div class="p-0">
 
    <div class="chat-window">
      <div *ngFor="let msg of messages" class="message"
           [ngClass]="{'your-message': msg.sender === 'You', 'bot-message': msg.sender !== 'You'}">
        <user-icon class="user-dp" [type]="msg.sender === 'You' ? 'user-male' : 'doctor-male'"></user-icon>
        <div class="message-content">
          <strong>{{ msg.sender }}:</strong>
          <div class="messagebox">
            <span>{{ msg.text }}</span>
            <small class="text-muted d-block">{{ msg.timestamp | date:'shortTime' }}</small>
          </div>
        </div>
      </div>
    </div>

    <div class="card-footer">
      <div class="input-group">
        <input [(ngModel)]="newMessage" type="text" class="form-control" placeholder="Type a message..."
               (keydown.enter)="sendMessage()">
        <button (click)="sendMessage()" class="btn btn-primary">Send</button>
      </div>
    </div>

</div>
